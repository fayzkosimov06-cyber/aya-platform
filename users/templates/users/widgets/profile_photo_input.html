<div class="pe-file-widget">
  <label class="pe-upload"><i class="fas fa-camera" aria-hidden="true"></i><span>Выбрать фотографию</span><input type="{{ widget.type }}" name="{{ widget.name }}"{% include 'django/forms/widgets/attrs.html' %}></label>
  {% if widget.is_initial and not widget.required %}<label class="pe-remove"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}><span>Удалить текущее фото</span></label>{% endif %}
</div>
