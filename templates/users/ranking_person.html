{% load aya_people %}<div class="award-person"><a class="award-profile" href="{% url 'public_profile' row.member.pk %}"><span class="award-portrait-wrap">{% portrait row.member 'medium' %}<span class="award-person-medal" aria-label="{{ group.place }} место"><i class="fas fa-medal" aria-hidden="true"></i></span></span><strong>{{ row.member.get_full_name|default:row.member.username }}</strong></a><span class="award-person-caption">{% if group.place == 1 %}Золотая награда{% elif group.place == 2 %}Серебряная награда{% else %}Бронзовая награда{% endif %}</span><a class="award-history" href="{% url 'rating_history' row.member.pk %}?{{ history_query }}">Вклад участника <span aria-hidden="true">↗</span></a></div>
