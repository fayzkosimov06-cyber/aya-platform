<div class="birthday-profile"><span>День рождения</span>{% if profile_user.birth_date %}<span class="contact-disclosure"><button type="button" class="contact-disclosure-button" data-reveal-url="{% url 'reveal_birthday' profile_user.pk %}" data-reveal-kind="date" data-csrf="{{ csrf_token }}"><i class="far fa-calendar" aria-hidden="true"></i><span>Показать дату</span><span aria-hidden="true">↗</span></button><span class="contact-disclosure-result" aria-live="polite"></span></span>{% else %}<span>Дата не указана</span>{% if user == profile_user %}<a href="{% url 'profile_edit' %}">Добавить дату рождения →</a>{% endif %}{% endif %}</div>
