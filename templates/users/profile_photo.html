{% load aya_people static %}
{% if profile_user.photo %}<button type="button" class="profile-photo-open" data-photo-endpoint="{% url 'open_profile_photo' profile_user.pk %}" data-csrf="{{ csrf_token }}" aria-label="Увеличить фотографию {{ profile_user.get_full_name|default:profile_user.username }}">{% portrait profile_user 'profile' %}<span class="photo-open-hint"><i class="fas fa-expand" aria-hidden="true"></i> Увеличить фото</span></button><span class="photo-open-error" role="status"></span>
<dialog class="profile-photo-dialog" aria-label="Фотография профиля"><div class="photo-dialog-toolbar"><strong data-photo-name></strong><div><button type="button" data-photo-zoom="out" aria-label="Уменьшить">−</button><button type="button" data-photo-zoom="reset">Сброс</button><button type="button" data-photo-zoom="in" aria-label="Увеличить">+</button><button type="button" data-photo-close aria-label="Закрыть фотографию">×</button></div></div><div class="photo-stage"><img alt="" draggable="false"></div><p>Масштаб: колёсиком или двумя пальцами. Перемещение: потяните фотографию.</p></dialog>
<link rel="stylesheet" href="{% static 'css/profile-photo.css' %}?v=1"><script src="{% static 'js/profile-photo.js' %}?v=1" defer></script>
{% else %}{% portrait profile_user 'profile' %}{% endif %}
