<form method="get" class="points-filters mb-4"><label>Период<select name="period" class="form-select"><option value="year" {% if period == 'year' %}selected{% endif %}>Учебный год</option><option value="month" {% if period == 'month' %}selected{% endif %}>Этот месяц</option><option value="week" {% if period == 'week' %}selected{% endif %}>Эта неделя</option><option value="all" {% if period == 'all' %}selected{% endif %}>За всё время</option></select></label><label>Учебный год<select name="year" class="form-select">{% for value,label in years %}<option value="{{ value }}" {% if value == selected_year %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button class="btn btn-primary">Показать</button></form>
