<form method="get" class="period-form"><fieldset class="period-tabs"><legend class="visually-hidden">Период</legend><label><input type="radio" name="period" value="week" {% if period == 'week' %}checked{% endif %}><span>Неделя</span></label><label><input type="radio" name="period" value="month" {% if period == 'month' %}checked{% endif %}><span>Месяц</span></label><label><input type="radio" name="period" value="year" {% if period == 'year' %}checked{% endif %}><span>Учебный год</span></label><label><input type="radio" name="period" value="all" {% if period == 'all' %}checked{% endif %}><span>Всё время</span></label></fieldset><label class="period-year"><span class="visually-hidden">Учебный год</span><select name="year" aria-label="Учебный год">{% for value,label in years %}<option value="{{ value }}" {% if value == selected_year %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button class="btn btn-outline-primary" type="submit">Показать</button></form>
