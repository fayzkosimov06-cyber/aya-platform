{% load aya_people %}<div class="ceremony-person"><a class="ceremony-profile" href="{% url 'public_profile' row.member.pk %}">{% portrait row.member 'medium' %}<strong>{{ row.member.get_full_name|default:row.member.username }}</strong></a><div class="ceremony-roles">{% role_badges row.member %}</div><a class="ceremony-history" href="{% url 'rating_history' row.member.pk %}?{{ history_query }}">{{ row.points }} баллов <span aria-hidden="true">↗</span></a></div>
