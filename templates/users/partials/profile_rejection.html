<div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="fas fa-user-times me-2"></i>Отклонить регистрацию</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="{% url 'reject_user' profile_user.pk %}" method="post">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <p class="mb-3">Вы уверены, что хотите отклонить и удалить профиль <strong>{{ profile_user.get_full_name }}</strong>?</p>
                    <div class="mb-3">
                        <label for="reason" class="form-label fw-bold small text-muted">Причина отклонения</label>
                        <textarea class="form-control bg-light" id="reason" name="reason" rows="3" placeholder="Укажите причину (обязательно)..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-danger rounded-pill px-4">Отклонить</button>
                </div>
            </form>
        </div>
    </div>
</div>
