<article class="aya-video-card">{% if file %}<video controls playsinline preload="metadata" {% if poster %}poster="{{ poster.url }}"{% endif %} aria-label="{{ title }}"><source src="{{ file.url }}">Ваш браузер не поддерживает воспроизведение видео. <a href="{{ file.url }}">Открыть файл</a></video>{% elif embed %}<div class="aya-video-ratio"><iframe src="{{ embed }}" title="{{ title }}" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>{% elif url %}<a class="aya-video-external" href="{{ url }}" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">▶</span><strong>{{ title }}</strong><small>Открыть видео на внешнем сайте ↗</small></a>{% endif %}{% if file or embed %}<div class="aya-video-caption"><strong>{{ title }}</strong>{% if url %}<a href="{{ url }}" target="_blank" rel="noopener noreferrer">Источник ↗</a>{% endif %}</div>{% endif %}</article>
