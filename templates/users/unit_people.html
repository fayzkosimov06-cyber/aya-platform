<div class="unit-people">{% for person in people %}<a class="unit-person" href="{% url 'public_profile' person.pk %}"><span class="unit-avatar">{% if person.photo %}<img src="{{ person.photo.url }}" alt="" loading="lazy">{% else %}<i class="fas fa-user" aria-hidden="true"></i>{% endif %}</span><strong>{{ person.get_full_name|default:person.username }}</strong><small>{{ person.get_role_display_custom }}</small></a>{% empty %}<p class="text-muted">Участники пока не добавлены.</p>{% endfor %}</div>
